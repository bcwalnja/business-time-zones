            <div class="tools">
                <button id="toggle-form" type="button" aria-label="Show add business form" aria-expanded="false"
                    title="Add a business">+</button>
                <button id="toggle-sheet" type="button" aria-label="Connect a Google Sheet" aria-expanded="false"
                    title="Connect a Google Sheet">▤</button>
            </div>
            <form id="add-business" hidden>
                <input id="business-name" type="text" placeholder="Business name" aria-label="Business name" required>
                <select id="business-zone" aria-label="US time zone">
                    <option>Pacific</option>
                    <option>Mountain</option>
                    <option>Central</option>
                    <option>Eastern</option>
                </select>
                <button type="submit">Add</button>
            </form>
            <form id="sheet-form" hidden>
                <input id="sheet-url" name="url" type="url" placeholder="Google Sheet link"
                    aria-label="Google Sheet link">
                <button type="submit">Load</button>
                <button id="disconnect-sheet" type="button">Clear</button>
                <output id="sheet-status" aria-live="polite"></output>
            </form>
            <section class="column pacific">
                <time class="zone-clock" data-zone="Pacific" aria-label="Pacific time"><span class="time"></span></time>
                <ul data-zone="Pacific"></ul>
            </section>
            <section class="column mountain">
                <time class="zone-clock" data-zone="Mountain" aria-label="Mountain time"><span class="time"></span></time>
                <ul data-zone="Mountain"></ul>
            </section>
            <section class="column central">
                <time class="zone-clock" data-zone="Central" aria-label="Central time"><span class="time"></span></time>
                <ul data-zone="Central"></ul>
            </section>
            <section class="column eastern">
                <time class="zone-clock" data-zone="Eastern" aria-label="Eastern time"><span class="time"></span></time>
                <ul data-zone="Eastern"></ul>
            </section>
